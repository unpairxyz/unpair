[package]
name = "unpair-desktop"
version = "0.1.0"
description = "The Unpair app. Holds the Zcash key on the user's device, shields every landing, runs the second hop."
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "unpair-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring = "4"
unpair-zcash = { path = "../../../packages/zcash" }
zcash_protocol = "0.11"
zip32 = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = []
# Route lightwalletd and broadcast through Tor (arti).
tor = ["unpair-zcash/tor"]
