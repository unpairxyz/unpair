[package]
name = "unpair-zcash-web"
version = "0.1.0"
description = "The Unpair Zcash crate for the browser: a per-swap transit wallet that lives in the page, compiled to WebAssembly."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
unpair-zcash = { path = "../zcash" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
secrecy = "0.10"
zcash_protocol = "0.11"
tracing = "0.1"
tracing-wasm = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
