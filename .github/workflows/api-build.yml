# Builds the API binary for a Linux x86_64 box and keeps it as an artifact,
# so the box itself never needs a Rust toolchain. Download it from the run
# and copy it to /usr/local/bin/unpair-api.
name: API binary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/zcash/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/api-build.yml"

permissions:
  contents: read

concurrency:
  group: api-binary
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
          key: api-release
      - run: cargo build -p unpair-api --release --locked
      - run: |
          sha256sum target/release/unpair-api | tee target/release/unpair-api.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpair-api-linux-x86_64
          path: |
            target/release/unpair-api
            target/release/unpair-api.sha256
          retention-days: 7
