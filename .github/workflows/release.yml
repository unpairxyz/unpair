# A tagged release: the API binary for Linux x86_64 and the web page, each
# with its sha256, attached to a GitHub Release for the tag. Deploys take
# their files from here, so what runs in production is what anyone can
# download and hash.
#
# The page is built with this repository's variables, so the released dist is
# the one the official origin serves and can be compared against it byte for
# byte. A self-hoster sets their own variables in a fork, or builds locally.
#
# Cut a release with a signed tag on main:
#   git tag -s v0.1.0 -m "v0.1.0" && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: API binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
          key: api-release
      - run: cargo build -p unpair-api --release --locked
      - run: |
          mkdir -p out
          cp target/release/unpair-api out/unpair-api-linux-x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-api
          path: out
          retention-days: 3

  web:
    name: Web page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @unpair/sdk build && pnpm --filter @unpair/client build

      - name: The browser wallet from the cache, when the Zcash crates did not change
        id: wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/public/wasm
          key: wasm-release-${{ hashFiles('packages/zcash/**', 'packages/zcash-web/**', 'vendor/**', 'Cargo.lock', 'apps/web/scripts/build-wasm.sh') }}
      - if: steps.wasm.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - if: steps.wasm.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
          key: wasm
      - if: steps.wasm.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - if: steps.wasm.outputs.cache-hit != 'true'
        name: wasm-pack, a pinned release with its checksum
        run: |
          curl -sSfL -o wasm-pack.tar.gz https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz
          echo "c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539  wasm-pack.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf wasm-pack.tar.gz --strip-components=1 -C "$HOME/.local/bin" --wildcards '*/wasm-pack'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/wasm-pack" --version
      - if: steps.wasm.outputs.cache-hit != 'true'
        name: The browser wallet, into public/wasm
        run: CC_wasm32_unknown_unknown=clang apps/web/scripts/build-wasm.sh release

      - name: Token and chain icons, served from our own origin
        continue-on-error: true
        run: node apps/web/scripts/fetch-icons.mjs
      - name: Build the page
        env:
          VITE_FEE_RECIPIENT: ${{ vars.VITE_FEE_RECIPIENT }}
          VITE_FEE_BPS: ${{ vars.VITE_FEE_BPS }}
          VITE_OFFICIAL_ORIGIN: ${{ vars.VITE_OFFICIAL_ORIGIN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_API_PUBKEY: ${{ vars.VITE_API_PUBKEY }}
          VITE_LWD_GRPC_WEB_URL: ${{ vars.VITE_LWD_GRPC_WEB_URL }}
          VITE_ZCASH_NETWORK: ${{ vars.VITE_ZCASH_NETWORK }}
          VITE_ONECLICK_JWT: ${{ secrets.VITE_ONECLICK_JWT }}
          BASE_PATH: /
        run: pnpm --filter @unpair/web build
      - name: Pack dist with fixed timestamps and order, so the archive hash is stable
        run: |
          mkdir -p out
          tar --sort=name --mtime='2000-01-01 00:00Z' --owner=0 --group=0 --numeric-owner \
            -C apps/web -cf - dist | gzip -n > out/unpair-web.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: out
          retention-days: 3

  publish:
    name: GitHub Release
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: in
      - name: Hashes
        run: |
          mkdir -p out
          cp in/release-api/unpair-api-linux-x86_64 in/release-web/unpair-web.tar.gz out/
          cd out && sha256sum unpair-api-linux-x86_64 unpair-web.tar.gz | tee SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "Linux x86_64 API binary and the web page as built for the official origin."
            echo
            echo '```'
            cat out/SHA256SUMS
            echo '```'
            echo
            echo "Check a download with \`sha256sum -c SHA256SUMS\`."
          } > notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md \
            out/unpair-api-linux-x86_64 out/unpair-web.tar.gz out/SHA256SUMS
