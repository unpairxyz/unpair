# A tagged release: the Build workflow's API binary and web page, each with
# its sha256, attached to a GitHub Release for the tag. Deploys take their
# files from here, so what runs in production is what anyone can download
# and hash. The page is built with this repository's variables, so the
# released dist is the one the official origin serves and can be compared
# against it byte for byte.
#
# Cut a release with a signed tag on main:
#   git tag -s v0.1.0 -m "v0.1.0" && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: in
      - name: Files and hashes. The page archive has fixed timestamps and order, so its hash is stable.
        run: |
          mkdir -p out
          cp in/unpair-api-linux-x86_64/unpair-api out/unpair-api-linux-x86_64
          tar --sort=name --mtime='2000-01-01 00:00Z' --owner=0 --group=0 --numeric-owner \
            -C in --transform 's,^unpair-web,dist,' -cf - unpair-web | gzip -n > out/unpair-web.tar.gz
          cd out && sha256sum unpair-api-linux-x86_64 unpair-web.tar.gz | tee SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "Linux x86_64 API binary and the web page as built for the official origin."
            echo
            echo '```'
            cat out/SHA256SUMS
            echo '```'
            echo
            echo "Check a download with \`sha256sum -c SHA256SUMS\`."
          } > notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md \
            out/unpair-api-linux-x86_64 out/unpair-web.tar.gz out/SHA256SUMS
