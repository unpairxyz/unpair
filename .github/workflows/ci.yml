# Checks on pull requests and on develop. Each job runs only when its part of
# the tree changed, so a copy change does not build the wallet. main is not
# checked again here: it only receives merges from develop, and a release
# builds what gets deployed.
name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read
  # The paths filter reads the pull request's file list. Dependabot's token
  # has no more than this, so without it every Dependabot run fails.
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
      rust: ${{ steps.filter.outputs.rust }}
      wasm: ${{ steps.filter.outputs.wasm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            web:
              - "apps/web/**"
              - "packages/sdk/**"
              - "packages/client/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".github/workflows/ci.yml"
            rust:
              - "apps/api/**"
              - "packages/zcash/**"
              - "packages/zcash-web/**"
              - "vendor/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - ".github/workflows/ci.yml"
            wasm:
              - "packages/zcash/**"
              - "packages/zcash-web/**"
              - "vendor/**"
              - "Cargo.lock"
              - "apps/web/scripts/build-wasm.sh"
              - ".github/actions/browser-wallet/**"

  web:
    name: SDK, client and web page
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test

  rust:
    name: API and Zcash crate
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
          shared-key: test
      - run: cargo fmt --all --check
      - run: cargo test -p unpair-api -p unpair-zcash --locked

  wasm:
    name: Browser wallet
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser-wallet
