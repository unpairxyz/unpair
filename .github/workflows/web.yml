# Builds the web page, keeps it as an artifact, and publishes it to GitHub
# Pages when the repository variable USE_PAGES is "true". Without Pages,
# download the artifact and serve dist/ from any static host.
#
# The browser wallet (wasm) is rebuilt only when the Zcash crates change;
# otherwise it comes from the cache, which keeps a page deploy to a few
# minutes.
#
# Set these repository variables (Settings, Secrets and variables, Actions):
#   VITE_FEE_RECIPIENT   NEAR account that receives the routing fee
#   VITE_FEE_BPS         fee in basis points, 0 to 100
#   VITE_OFFICIAL_ORIGIN https://your.domain
#   VITE_API_URL         https://api.your.domain, or empty for no API
#   VITE_API_PUBKEY      hex key from GET /v1/pubkey on that API
#   VITE_LWD_GRPC_WEB_URL gRPC-web proxy for the browser wallet, or empty
#   VITE_ZCASH_NETWORK   main or test
#   PAGES_DOMAIN         your.domain, to write the CNAME file; empty for a
#                        project page under /<repo>/
#   USE_PAGES            "true" to publish to GitHub Pages; otherwise the
#                        build is only kept as the artifact "unpair-web"
# and this secret, optional:
#   VITE_ONECLICK_JWT    1Click partner key. It ends up in the public bundle,
#                        like every VITE_ value; a secret keeps it out of logs.
name: Web page

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "vendor/**"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @unpair/sdk build && pnpm --filter @unpair/client build

      - name: The browser wallet from the cache, when the Zcash crates did not change
        id: wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/public/wasm
          key: wasm-release-${{ hashFiles('packages/zcash/**', 'packages/zcash-web/**', 'vendor/**', 'Cargo.lock', 'apps/web/scripts/build-wasm.sh') }}
      - if: steps.wasm.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - if: steps.wasm.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
          key: wasm
      - if: steps.wasm.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - if: steps.wasm.outputs.cache-hit != 'true'
        name: wasm-pack, a pinned release with its checksum
        run: |
          curl -sSfL -o wasm-pack.tar.gz https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz
          echo "c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539  wasm-pack.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf wasm-pack.tar.gz --strip-components=1 -C "$HOME/.local/bin" --wildcards '*/wasm-pack'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/wasm-pack" --version
      - if: steps.wasm.outputs.cache-hit != 'true'
        name: The browser wallet, into public/wasm
        run: CC_wasm32_unknown_unknown=clang apps/web/scripts/build-wasm.sh release

      - name: Token and chain icons, served from our own origin
        continue-on-error: true
        run: node apps/web/scripts/fetch-icons.mjs
      - name: Build the page
        env:
          VITE_FEE_RECIPIENT: ${{ vars.VITE_FEE_RECIPIENT }}
          VITE_FEE_BPS: ${{ vars.VITE_FEE_BPS }}
          VITE_OFFICIAL_ORIGIN: ${{ vars.VITE_OFFICIAL_ORIGIN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_API_PUBKEY: ${{ vars.VITE_API_PUBKEY }}
          VITE_LWD_GRPC_WEB_URL: ${{ vars.VITE_LWD_GRPC_WEB_URL }}
          VITE_ZCASH_NETWORK: ${{ vars.VITE_ZCASH_NETWORK }}
          VITE_ONECLICK_JWT: ${{ secrets.VITE_ONECLICK_JWT }}
          BASE_PATH: ${{ vars.USE_PAGES == 'true' && vars.PAGES_DOMAIN == '' && format('/{0}/', github.event.repository.name) || '/' }}
        run: pnpm --filter @unpair/web build
      - name: Custom domain
        if: vars.USE_PAGES == 'true' && vars.PAGES_DOMAIN != ''
        run: echo "${{ vars.PAGES_DOMAIN }}" > apps/web/dist/CNAME
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpair-web
          path: apps/web/dist
          retention-days: 7
      - if: vars.USE_PAGES == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    if: vars.USE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
